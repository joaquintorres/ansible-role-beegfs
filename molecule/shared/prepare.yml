---
- name: Prepare
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Install python for Ansible
      raw: test -e /usr/bin/python3 || test -e /usr/libexec/platform-python || dnf -y install python3
      changed_when: false

    - name: Update the kernel, so a matching kernel-devel is in the repos
      dnf:
        name: kernel
        state: latest
      register: kernel_update

    - name: Boot the updated kernel
      reboot:
      when: kernel_update is changed

    - name: Gather network facts
      setup:
        gather_subset: [network]

    - name: Resolve the hostname to the VM's address like on a real cluster, not 127.0.1.1 (Vagrant)
      lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        line: "{{ ansible_default_ipv4.address }} {{ inventory_hostname }}"

- name: Build kmod-beegfs
  import_playbook: build-kmod.yml
