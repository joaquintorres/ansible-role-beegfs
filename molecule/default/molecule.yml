---
dependency:
  name: galaxy
driver:
  name: vagrant
  provider:
    name: libvirt
platforms:
  - name: el9
    box: almalinux/9
    cpus: 2
    memory: 2048
    provider_raw_config_args:
      - "storage :file, :size => '20G'"
    config_options:
      synced_folder: false
    groups:
      - cluster_beegfs_mgmt
      - cluster_beegfs_mds
      - cluster_beegfs_oss
      - cluster_beegfs_client
provisioner:
  name: ansible
  log: true
  playbooks:
    prepare: ../shared/prepare.yml
    converge: ../shared/converge.yml
  inventory:
    group_vars:
      all:
        beegfs_version: "8.4"
verifier:
  name: testinfra
  directory: ../tests
  options:
    verbose: true
